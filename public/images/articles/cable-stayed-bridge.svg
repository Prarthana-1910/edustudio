<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#172A3A"/>
  <!-- Blueprint grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F5F3EE" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid)" />
  
  <!-- Water baseline -->
  <line x1="0" y1="360" x2="800" y2="360" stroke="#D9D9D6" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="0" y="360" width="800" height="90" fill="#172A3A" fill-opacity="0.8"/>
  
  <!-- Bridge Pylon A-frame -->
  <path d="M380 360 L396 60 L404 60 L420 360" stroke="#F5F3EE" stroke-width="6" stroke-linecap="square"/>
  <path d="M390 180 L410 180" stroke="#F5F3EE" stroke-width="4"/>
  <path d="M384 270 L416 270" stroke="#F5F3EE" stroke-width="4"/>
  
  <!-- Deck Beam -->
  <rect x="40" y="270" width="720" height="16" fill="#F5F3EE"/>
  <rect x="40" y="286" width="720" height="6" fill="#F28C28"/>
  
  <!-- Stay Cables (Orange & Concrete) -->
  <g stroke="#F28C28" stroke-width="2" stroke-opacity="0.9">
    <line x1="400" y1="90" x2="160" y2="270"/>
    <line x1="400" y1="120" x2="220" y2="270"/>
    <line x1="400" y1="150" x2="280" y2="270"/>
    <line x1="400" y1="180" x2="330" y2="270"/>
    
    <line x1="400" y1="90" x2="640" y2="270"/>
    <line x1="400" y1="120" x2="580" y2="270"/>
    <line x1="400" y1="150" x2="520" y2="270"/>
    <line x1="400" y1="180" x2="470" y2="270"/>
  </g>
  
  <!-- Technical annotations -->
  <text x="60" y="60" fill="#F4C542" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold">DWG NO. BR-2026 // CABLE STAY TENSION EQUILIBRIUM</text>
  <text x="60" y="85" fill="#D9D9D6" font-family="JetBrains Mono, monospace" font-size="11">SPAN: 480m | CANTILEVER RATIO: 0.42 | TENDON DIA: 15.7mm</text>
  <circle cx="400" cy="60" r="8" fill="#F4C542"/>
</svg>
