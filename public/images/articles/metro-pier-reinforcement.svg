<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#172A3A"/>
  <defs>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#F5F3EE" stroke-width="0.6" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#grid2)" />
  
  <!-- Pier Column Section Rebar Cage -->
  <circle cx="400" cy="225" r="140" stroke="#F5F3EE" stroke-width="6" stroke-dasharray="12 6"/>
  <circle cx="400" cy="225" r="115" stroke="#F28C28" stroke-width="3"/>
  <circle cx="400" cy="225" r="90" stroke="#F4C542" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Longitudinal Rebar Dots in Circle -->
  <g fill="#F28C28">
    <circle cx="400" cy="110" r="7"/>
    <circle cx="481" cy="144" r="7"/>
    <circle cx="515" cy="225" r="7"/>
    <circle cx="481" cy="306" r="7"/>
    <circle cx="400" cy="340" r="7"/>
    <circle cx="319" cy="306" r="7"/>
    <circle cx="285" cy="225" r="7"/>
    <circle cx="319" cy="144" r="7"/>
    <circle cx="445" cy="120" r="6"/>
    <circle cx="505" cy="178" r="6"/>
    <circle cx="505" cy="272" r="6"/>
    <circle cx="445" cy="330" r="6"/>
    <circle cx="355" cy="330" r="6"/>
    <circle cx="295" cy="272" r="6"/>
    <circle cx="295" cy="178" r="6"/>
    <circle cx="355" cy="120" r="6"/>
  </g>
  
  <!-- Cross tie links -->
  <line x1="285" y1="225" x2="515" y2="225" stroke="#D9D9D6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="400" y1="110" x2="400" y2="340" stroke="#D9D9D6" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <text x="60" y="60" fill="#F4C542" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold">SEC A-A // HIGH-CONFINEMENT METRO PIER CAGE</text>
  <text x="60" y="85" fill="#D9D9D6" font-family="JetBrains Mono, monospace" font-size="11">SPIRAL TIE #5 @ 75mm PITCH | 24 #11 TIE-IN DOWELS | f'c = 60 MPa</text>
</svg>
