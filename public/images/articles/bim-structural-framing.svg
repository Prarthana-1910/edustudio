<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#172A3A"/>
  <!-- Isometric framing wireframe -->
  <g stroke="#D9D9D6" stroke-width="1.5" stroke-opacity="0.8">
    <!-- Base grid -->
    <path d="M150 300 L400 400 L650 300 L400 200 Z" />
    <line x1="275" y1="250" x2="525" y2="350"/>
    <line x1="525" y1="250" x2="275" y2="350"/>
    
    <!-- Vertical columns -->
    <line x1="400" y1="400" x2="400" y2="240" stroke="#F28C28" stroke-width="3"/>
    <line x1="150" y1="300" x2="150" y2="140" stroke="#F5F3EE" stroke-width="2.5"/>
    <line x1="650" y1="300" x2="650" y2="140" stroke="#F5F3EE" stroke-width="2.5"/>
    <line x1="400" y1="200" x2="400" y2="70" stroke="#F5F3EE" stroke-width="2.5"/>
    
    <!-- Upper deck framing -->
    <path d="M150 140 L400 240 L650 140 L400 70 Z" stroke="#F28C28" stroke-width="3"/>
    
    <!-- Clash detection markers -->
    <circle cx="340" cy="216" r="10" stroke="#F4C542" stroke-width="2" fill="#F4C542" fill-opacity="0.3"/>
    <line x1="330" y1="206" x2="350" y2="226" stroke="#F4C542" stroke-width="2"/>
    <line x1="350" y1="206" x2="330" y2="226" stroke="#F4C542" stroke-width="2"/>
  </g>
  <text x="60" y="60" fill="#F4C542" font-family="JetBrains Mono, monospace" font-size="14" font-weight="bold">IFC4 BIM VDC // REAL-TIME POINT CLOUD CLASH TELEMETRY</text>
  <text x="60" y="85" fill="#D9D9D6" font-family="JetBrains Mono, monospace" font-size="11">TOLERANCE THRESHOLD: 8mm | 340 CLASHES AUTO-RESOLVED BEFORE POUR</text>
</svg>
